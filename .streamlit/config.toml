[theme]
base = "light"

# General color setup
textColor = "#1C1C25"
primaryColor = "#E10600"

# Widgets
showWidgetBorder = true
borderColor = "#303037"

# Base text - Use Titillium Web
font = "Titillium Web, sans-serif"
baseFontWeight = 350
baseFontSize = 14

# Heading text
headingFont = "Titillium Web, sans-serif"
headingFontWeights = [750, 650, 570, 320, 200, 180]
headingFontSizes = ["3rem", "1.8rem", "1.2rem", "1.2rem"]

# Font Faces - Load Titillium Web from Google Fonts
[[theme.fontFaces]]
family = "Titillium Web"
url = "https://fonts.googleapis.com/css2?family=Titillium+Web:wght@300;400;600;700;900&display=swap"

